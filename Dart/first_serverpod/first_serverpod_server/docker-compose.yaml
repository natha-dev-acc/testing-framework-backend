services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: first_serverpod
      POSTGRES_PASSWORD: "65inw0URubzf_rWfbdTvpNc9PUNTQKKS"
    volumes:
      - first_serverpod_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "RU6EKIXN4-FybSy3IWpMPDJUWzlXk3Y9"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: first_serverpod_test
      POSTGRES_PASSWORD: "ZLnp3qIxnNIXlT2HaqUJr0uTvgtMIt8p"
    volumes:
      - first_serverpod_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "TXMaCk6aHyM21n01W2RAgEMDgdpMrgEH"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  first_serverpod_data:
  first_serverpod_test_data:
